]]></style><rect width="1160" height="400" rx="20" class="bg"/><text x="45" y="56" class="title">Shared Library Debug Symbols</text><text x="45" y="86" class="subtitle">Why execution can work while the debugger still reports missing symbols.</text><rect x="48" y="127" width="485" height="169" rx="18" class="panel"/><rect x="626" y="127" width="485" height="169" rx="18" class="panel"/><text x="76" y="163" class="heading">Target runtime</text><text x="76" y="199" class="body">Linux loader opens libhello.so</text><text x="76" y="235" class="body">Program can execute the library</text><text x="654" y="163" class="heading">Host debugger</text><text x="654" y="199" class="body">GDB needs a matching libhello.so</text><text x="654" y="235" class="body">with debugging information (-g)</text><path d="M533 214 H625" class="arrow"/><rect x="154" y="317" width="850" height="55" rx="18" class="mint"/><text x="189" y="352" class="body">GDB commands: info sharedlibrary  •  set solib-search-path  •  set sysroot</text></svg>