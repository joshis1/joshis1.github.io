<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Follow the work beyond the release</title><desc id="desc">A sample flow from identifying a need through prioritisation, design, change, use and measurement. A value stream can include several processes and does not guarantee an outcome.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f7fafc" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007f83" stroke="none" stroke-width="1"/><text x="72" y="67" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="2">05 / VALUE STREAMS</text><text x="72" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#102942">Follow the work beyond the release</text><text x="72" y="168" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">An illustrative path for an enterprise operations improvement request.</text><rect x="72" y="228" width="462" height="185" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="96" y="264" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83">01</text><text x="96" y="304" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10243d">Identify need</text><text x="96" y="342" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">Understand the issue</text><text x="96" y="371" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">and baseline.</text><rect x="569" y="228" width="462" height="185" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="593" y="264" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83">02</text><text x="593" y="304" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10243d">Prioritise</text><text x="593" y="342" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">Assess impact, options</text><text x="593" y="371" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">and funding.</text><rect x="1066" y="228" width="462" height="185" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="1090" y="264" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83">03</text><text x="1090" y="304" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10243d">Shape</text><text x="1090" y="342" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">Explore a solution</text><text x="1090" y="371" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">with users and teams.</text><rect x="72" y="447" width="462" height="185" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="96" y="483" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83">04</text><text x="96" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10243d">Change</text><text x="96" y="561" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">Build, test and prepare</text><text x="96" y="590" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">for operations.</text><rect x="569" y="447" width="462" height="185" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="593" y="483" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83">05</text><text x="593" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10243d">Use + support</text><text x="593" y="561" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">Enable users and</text><text x="593" y="590" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">support the service.</text><rect x="1066" y="447" width="462" height="185" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="1090" y="483" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83">06</text><text x="1090" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#10243d">Measure</text><text x="1090" y="561" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">Review outcomes</text><text x="1090" y="590" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#52657b">and improve.</text><rect x="72" y="697" width="714" height="195" rx="18" fill="#e9f4f3" stroke="none" stroke-width="1"/><text x="100" y="743" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">VALUE STREAM</text><text x="100" y="784" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#10243d">The wider flow for a particular need,</text><text x="100" y="818" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#10243d">across teams and their activities.</text><rect x="814" y="697" width="714" height="195" rx="18" fill="#eaf0f8" stroke="none" stroke-width="1"/><text x="842" y="743" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#2563a6" letter-spacing="1">PROCESS</text><text x="842" y="784" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#10243d">A set of related activities that turn inputs</text><text x="842" y="818" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#10243d">into outputs, such as an approval process.</text><text x="100" y="866" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">A value stream can include several processes.</text><text x="842" y="866" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Outputs do not by themselves prove outcomes.</text><line x1="72" y1="937" x2="1528" y2="937" stroke="#d9e4ea" stroke-width="2"/><text x="72" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Independent learning visual • Inspired by ITIL® (Version 5) • Not an official diagram</text><text x="1528" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#52657b">ITIL® is a registered trademark of the PeopleCert group.</text></svg>