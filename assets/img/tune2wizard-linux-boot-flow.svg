<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-label="Classic Linux Boot Sequence"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1477bf"/></marker><marker id="arrowteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007f88"/></marker></defs><style><![CDATA[
  .bg{fill:#f7fbff}.panel{fill:#fff;stroke:#c6d7e6;stroke-width:2}.deep{fill:#0f2946}.blue{fill:#1477bf}.teal{fill:#007f88}.orange{fill:#d77b24}.title{font:700 31px Arial,sans-serif;fill:#112c49}.subtitle{font:400 16px Arial,sans-serif;fill:#45627d}.heading{font:700 22px Arial,sans-serif;fill:#153957}.body{font:400 17px Arial,sans-serif;fill:#183652}.small{font:400 14px Arial,sans-serif;fill:#45627d}.micro{font:600 13px Arial,sans-serif;fill:#55738e}.light{fill:#eff8fd}.mint{fill:#eaf8f4}.peach{fill:#fff4e6}.pill{fill:#0d5189}.white{font:700 18px Arial,sans-serif;fill:white}.arrow{stroke:#1477bf;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrow-teal{stroke:#007f88;stroke-width:4;fill:none;marker-end:url(#arrowteal)}.dashed{stroke:#3c91b2;stroke-width:3;fill:none;stroke-dasharray:10 9;animation:move 2.4s linear infinite}.outline{stroke:#d6e2ed;stroke-width:2}.tag{font:700 14px Arial,sans-serif;fill:#0d5189}@keyframes move{to{stroke-dashoffset:-38}}@media (prefers-reduced-motion:reduce){.dashed{animation:none}}
]]></style><rect width="1160" height="470" rx="20" class="bg"/><text x="45" y="56" class="title">Classic Linux Boot Sequence</text><text x="45" y="86" class="subtitle">The historical BIOS + MBR + GRUB + SysV init pathway (not universal).</text><rect x="42" y="165" width="169" height="141" rx="18" class="panel"/><rect x="43" y="166" width="167" height="57" rx="17" fill="#ddeeff"/><text x="62" y="205" class="heading">POST</text><text x="54" y="260" class="small">Hardware checks</text><path d="M211 235 H226" class="arrow"/><rect x="229" y="165" width="169" height="141" rx="18" class="panel"/><rect x="230" y="166" width="167" height="57" rx="17" fill="#dcf1f5"/><text x="249" y="205" class="heading">BIOS</text><text x="241" y="260" class="small">Find boot device</text><path d="M398 235 H413" class="arrow"/><rect x="416" y="165" width="169" height="141" rx="18" class="panel"/><rect x="417" y="166" width="167" height="57" rx="17" fill="#fff1dc"/><text x="436" y="205" class="heading">MBR</text><text x="428" y="260" class="small">Read boot sector</text><path d="M585 235 H600" class="arrow"/><rect x="603" y="165" width="169" height="141" rx="18" class="panel"/><rect x="604" y="166" width="167" height="57" rx="17" fill="#ddeeff"/><text x="623" y="205" class="heading">GRUB</text><text x="615" y="260" class="small">Load kernel</text><path d="M772 235 H787" class="arrow"/><rect x="790" y="165" width="169" height="141" rx="18" class="panel"/><rect x="791" y="166" width="167" height="57" rx="17" fill="#dcf1f5"/><text x="810" y="205" class="heading">KERNEL</text><text x="802" y="260" class="small">Set up Linux</text><path d="M959 235 H974" class="arrow"/><rect x="977" y="165" width="169" height="141" rx="18" class="panel"/><rect x="978" y="166" width="167" height="57" rx="17" fill="#fff1dc"/><text x="997" y="205" class="heading">PID 1</text><text x="989" y="260" class="small">Start userspace</text><rect x="75" y="343" width="1010" height="79" rx="18" class="mint"/><text x="110" y="374" class="body">Modern systems may use UEFI + GPT + systemd instead.</text><text x="110" y="401" class="small">The useful principle: find the earliest stage that failed.</text></svg>