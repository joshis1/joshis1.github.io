<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Look at the whole service</title><desc id="desc">Four perspectives on product and service management: organisations and people, information and technology, partners and suppliers, and value streams and processes. Political, economic, social, technological, legal and environmental factors influence them.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f7fafc" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007f83" stroke="none" stroke-width="1"/><text x="72" y="67" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="2">02 / FOUR DIMENSIONS</text><text x="72" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#102942">Look at the whole service</text><text x="72" y="168" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">Four perspectives help teams understand how a service creates value.</text><rect x="72" y="220" width="714" height="215" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="97" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">01</text><text x="97" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Organisations and people</text><text x="97" y="325" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Skills, roles, culture and leadership</text><text x="97" y="352" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Can the right people make decisions and raise risks?</text><rect x="97" y="371" width="54" height="6" rx="3" fill="#007f83" stroke="none" stroke-width="1"/><rect x="814" y="220" width="714" height="215" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="839" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">02</text><text x="839" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Information and technology</text><text x="839" y="325" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Data, systems, tools and knowledge</text><text x="839" y="352" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Are the information and technology fit for use?</text><rect x="839" y="371" width="54" height="6" rx="3" fill="#007f83" stroke="none" stroke-width="1"/><rect x="72" y="465" width="714" height="215" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="97" y="504" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">03</text><text x="97" y="537" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Partners and suppliers</text><text x="97" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">External capabilities and relationships</text><text x="97" y="597" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Are responsibilities, support and dependencies clear?</text><rect x="97" y="616" width="54" height="6" rx="3" fill="#007f83" stroke="none" stroke-width="1"/><rect x="814" y="465" width="714" height="215" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="839" y="504" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">04</text><text x="839" y="537" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Value streams and processes</text><text x="839" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">The work, handoffs and flow</text><text x="839" y="597" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">How does a request move from need to outcome?</text><rect x="839" y="616" width="54" height="6" rx="3" fill="#007f83" stroke="none" stroke-width="1"/><rect x="72" y="730" width="1456" height="160" rx="20" fill="#102942" stroke="none" stroke-width="1"/><text x="105" y="777" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#9ae0d9" letter-spacing="1">EXTERNAL INFLUENCES  /  PESTLE</text><rect x="104" y="803" width="213" height="52" rx="10" fill="#28425b" stroke="none" stroke-width="1"/><text x="210" y="837" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="white">Political</text><rect x="334" y="803" width="213" height="52" rx="10" fill="#28425b" stroke="none" stroke-width="1"/><text x="440" y="837" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="white">Economic</text><rect x="564" y="803" width="213" height="52" rx="10" fill="#28425b" stroke="none" stroke-width="1"/><text x="670" y="837" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="white">Social</text><rect x="794" y="803" width="213" height="52" rx="10" fill="#28425b" stroke="none" stroke-width="1"/><text x="900" y="837" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="white">Technological</text><rect x="1024" y="803" width="213" height="52" rx="10" fill="#28425b" stroke="none" stroke-width="1"/><text x="1130" y="837" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="white">Legal</text><rect x="1254" y="803" width="213" height="52" rx="10" fill="#28425b" stroke="none" stroke-width="1"/><text x="1360" y="837" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="white">Environmental</text><text x="105" y="878" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#d0e1e8">These influences can affect all four dimensions.</text><line x1="72" y1="937" x2="1528" y2="937" stroke="#d9e4ea" stroke-width="2"/><text x="72" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Independent learning visual • Inspired by ITIL® (Version 5) • Not an official diagram</text><text x="1528" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#52657b">ITIL® is a registered trademark of the PeopleCert group.</text></svg>