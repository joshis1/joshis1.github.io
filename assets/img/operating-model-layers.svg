<text x="100" y="116" fill="#39D4BD" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">OPERATING MODEL DESIGN</text><text x="100" y="180" fill="#EAF2FF" font-size="54" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">An operating model is bigger than a job chart</text>
<rect x="105" y="275" width="1390" height="420" rx="24" fill="#152B45" stroke="#344F70" stroke-width="2"/><rect x="139" y="323" width="1320" height="74" rx="12" fill="#203653" stroke="#3A5576" stroke-width="2"/><rect x="140" y="323" width="12" height="74" rx="6" fill="#74AEFF"/><text x="184" y="355" fill="#EAF2FF" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">STRATEGY &amp; GOVERNANCE</text><text x="184" y="381" fill="#9EB2D3" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="start">Which outcomes matter and who sets direction?</text><rect x="139" y="416" width="1320" height="74" rx="12" fill="#203653" stroke="#3A5576" stroke-width="2"/><rect x="140" y="416" width="12" height="74" rx="6" fill="#39D4BD"/><text x="184" y="448" fill="#EAF2FF" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">DECISION RIGHTS</text><text x="184" y="474" fill="#9EB2D3" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="start">Who can prioritise, accept risk and approve changes?</text><rect x="139" y="509" width="1320" height="74" rx="12" fill="#203653" stroke="#3A5576" stroke-width="2"/><rect x="140" y="509" width="12" height="74" rx="6" fill="#FFCC73"/><text x="184" y="541" fill="#EAF2FF" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">TEAMS &amp; PARTNERS</text><text x="184" y="567" fill="#9EB2D3" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="start">Who performs analysis, build, test, operate and support?</text><rect x="139" y="602" width="1320" height="74" rx="12" fill="#203653" stroke="#3A5576" stroke-width="2"/><rect x="140" y="602" width="12" height="74" rx="6" fill="#C19BFF"/><text x="184" y="634" fill="#EAF2FF" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">VALUE STREAMS &amp; WORKFLOWS</text><text x="184" y="660" fill="#9EB2D3" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="start">How does work flow from demand to value?</text><text x="800" y="754" fill="#FFCC73" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="middle">Changing a role may redistribute work; it does not automatically remove a capability.</text>
<text x="1490" y="806" fill="#9EB2D3" font-size="17" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="end">SYSTEMS · DELIVERY · VALUE</text>
