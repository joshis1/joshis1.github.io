<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">From a need to a valuable service</title><desc id="desc">A personal interpretation of the ITIL Value System. Opportunity and demand connect to stakeholder value through guiding principles, governance, a value chain with eight lifecycle activities, management practices, and continual improvement.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f7fafc" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007f83" stroke="none" stroke-width="1"/><text x="72" y="67" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="2">01 / BIG PICTURE</text><text x="72" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#102942">From a need to a valuable service</text><text x="72" y="168" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">The value system connects direction, delivery and improvement.</text><rect x="72" y="205" width="390" height="105" rx="18" fill="#e5f3f2" stroke="none" stroke-width="1"/><text x="100" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">OPPORTUNITY + DEMAND</text><text x="100" y="281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">A need or possibility</text><rect x="537" y="205" width="525" height="105" rx="18" fill="#102942" stroke="none" stroke-width="1"/><text x="799" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#8dd9d3" letter-spacing="1">ITIL VALUE SYSTEM</text><text x="799" y="281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="white">Work together to enable value</text><rect x="1138" y="205" width="390" height="105" rx="18" fill="#e5f3f2" stroke="none" stroke-width="1"/><text x="1166" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">VALUE FOR STAKEHOLDERS</text><text x="1166" y="281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Outcomes and experience</text><path d="M476 257 H516 M507 248 L516 257 L507 266 M1078 257 H1118 M1109 248 L1118 257 L1109 266" stroke="#7d95a8" stroke-width="3" fill="none"/><rect x="72" y="343" width="1456" height="548" rx="24" fill="white" stroke="#d9e4ea" stroke-width="2"/><text x="104" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">FIVE CONNECTED COMPONENTS</text><rect x="104" y="415" width="682" height="87" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="129" y="454" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Guiding principles</text><text x="129" y="487" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">How we make decisions</text><rect x="814" y="415" width="682" height="87" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="839" y="454" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Governance</text><text x="839" y="487" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">How the organisation is directed and controlled</text><text x="105" y="545" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">VALUE CHAIN: EIGHT LIFECYCLE ACTIVITIES</text><rect x="104" y="566" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="120" y="593" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Discover</text><text x="120" y="617" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Understand needs</text><rect x="452" y="566" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="468" y="593" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Design</text><text x="468" y="617" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Shape the solution</text><rect x="800" y="566" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="816" y="593" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Acquire</text><text x="816" y="617" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Obtain resources</text><rect x="1148" y="566" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="1164" y="593" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Build</text><text x="1164" y="617" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Create and test</text><rect x="104" y="648" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="120" y="675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Transition</text><text x="120" y="699" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Introduce change</text><rect x="452" y="648" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="468" y="675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Operate</text><text x="468" y="699" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Keep systems running</text><rect x="800" y="648" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="816" y="675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Deliver</text><text x="816" y="699" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Provide the service</text><rect x="1148" y="648" width="327" height="68" rx="12" fill="#f6f9fc" stroke="none" stroke-width="1"/><text x="1164" y="675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Support</text><text x="1164" y="699" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Help and restore</text><rect x="104" y="745" width="682" height="87" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="129" y="784" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Management practices</text><text x="129" y="817" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Capabilities such as incident and supplier management</text><rect x="814" y="745" width="682" height="87" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="839" y="784" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Continual improvement</text><text x="839" y="817" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Learn, measure and adapt</text><text x="104" y="870" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#52657b">Activities are connected and adaptable; they are not a required sequence.</text><line x1="72" y1="937" x2="1528" y2="937" stroke="#d9e4ea" stroke-width="2"/><text x="72" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Independent learning visual • Inspired by ITIL® (Version 5) • Not an official diagram</text><text x="1528" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#52657b">ITIL® is a registered trademark of the PeopleCert group.</text></svg>