<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">How closely do we work together?</title><desc id="desc">Basic, cooperative and collaborative service relationships vary in coordination and strategic alignment. A configurable product alone does not prove a partnership.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f7fafc" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007f83" stroke="none" stroke-width="1"/><text x="72" y="67" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="2">04 / SERVICE RELATIONSHIPS</text><text x="72" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#102942">How closely do we work together?</text><text x="72" y="168" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">The relationship is defined by the way people and organisations interact.</text><rect x="72" y="230" width="466" height="430" rx="22" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="101" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">01</text><text x="101" y="340" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#10243d">Basic</text><rect x="101" y="365" width="225" height="38" rx="8" fill="#e6f4f2" stroke="none" stroke-width="1"/><text x="114" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="0.5">TRANSACTIONAL</text><text x="101" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">Standard service and agreed</text><text x="101" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">support with limited interaction.</text><text x="101" y="534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">Focus: efficient fulfilment.</text><rect x="567" y="230" width="466" height="430" rx="22" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="596" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">02</text><text x="596" y="340" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#10243d">Cooperative</text><rect x="596" y="365" width="225" height="38" rx="8" fill="#e6f4f2" stroke="none" stroke-width="1"/><text x="609" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="0.5">COORDINATED</text><text x="596" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">Information sharing and joint</text><text x="596" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">work on specific needs.</text><text x="596" y="534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">Focus: improvement together.</text><rect x="1062" y="230" width="466" height="430" rx="22" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="1091" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">03</text><text x="1091" y="340" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#10243d">Collaborative</text><rect x="1091" y="365" width="225" height="38" rx="8" fill="#e6f4f2" stroke="none" stroke-width="1"/><text x="1104" y="390" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="0.5">PARTNERSHIP</text><text x="1091" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">Shared planning, trust and</text><text x="1091" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">stronger alignment on outcomes.</text><text x="1091" y="534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">Focus: strategic collaboration.</text><rect x="72" y="718" width="1456" height="180" rx="20" fill="#102942" stroke="none" stroke-width="1"/><text x="105" y="766" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#9ae0d9" letter-spacing="1">IMPORTANT DISTINCTION</text><text x="105" y="808" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="white">A configurable product does not, by itself, tell us what kind of relationship exists.</text><text x="105" y="845" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="white">Look at shared goals, decision rights, information sharing and the way issues are resolved.</text><line x1="72" y1="937" x2="1528" y2="937" stroke="#d9e4ea" stroke-width="2"/><text x="72" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Independent learning visual • Inspired by ITIL® (Version 5) • Not an official diagram</text><text x="1528" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#52657b">ITIL® is a registered trademark of the PeopleCert group.</text></svg>