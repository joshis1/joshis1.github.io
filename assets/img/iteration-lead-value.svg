<text x="100" y="116" fill="#39D4BD" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">DELIVERY LEADERSHIP</text><text x="100" y="180" fill="#EAF2FF" font-size="54" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="start">If the team runs itself, what does the leader own?</text>
<rect x="100" y="275" width="650" height="110" rx="24" fill="#17334A" stroke="#356381" stroke-width="2"/><text x="425" y="322" fill="#EAF2FF" font-size="30" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="middle">SPECIALIST TEAMS</text><text x="425" y="352" fill="#9EB2D3" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Analysis  ·  Build  ·  Test  ·  Operate</text><rect x="845" y="275" width="610" height="110" rx="24" fill="#12403F" stroke="#2D8276" stroke-width="2"/><text x="1150" y="322" fill="#EAF2FF" font-size="29" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="middle">INTEGRATED DELIVERY</text><text x="1150" y="353" fill="#9EB2D3" font-size="22" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Dependencies  ·  Risks  ·  Forecast</text><path d="M760 333 L826 333" stroke="#FFCC73" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M816.0959726210839 339.7757096807404 L826 333 L816.0959726210839 326.2242903192596" fill="none" stroke="#FFCC73" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="448" width="610" height="65" rx="13" fill="#1A2C47" stroke="#334E70" stroke-width="2"/><text x="425" y="490" fill="#EAF2FF" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Requirements are ready</text><rect x="864" y="448" width="564" height="65" rx="13" fill="#173744" stroke="#2C7472" stroke-width="2"/><text x="1146" y="490" fill="#EAF2FF" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Are handoffs and dates credible?</text><rect x="120" y="531" width="610" height="65" rx="13" fill="#1A2C47" stroke="#334E70" stroke-width="2"/><text x="425" y="573" fill="#EAF2FF" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Vendor fix is planned</text><rect x="864" y="531" width="564" height="65" rx="13" fill="#173744" stroke="#2C7472" stroke-width="2"/><text x="1146" y="573" fill="#EAF2FF" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Will regression still fit?</text><rect x="120" y="614" width="610" height="65" rx="13" fill="#1A2C47" stroke="#334E70" stroke-width="2"/><text x="425" y="656" fill="#EAF2FF" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Testing is underway</text><rect x="864" y="614" width="564" height="65" rx="13" fill="#173744" stroke="#2C7472" stroke-width="2"/><text x="1146" y="656" fill="#EAF2FF" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="middle">Is release readiness genuinely known?</text><text x="797" y="766" fill="#FFCC73" font-size="23" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="middle">A delivery lead connects the signals; a status reporter only repeats them.</text>
<text x="1490" y="806" fill="#9EB2D3" font-size="17" font-family="DejaVu Sans,Arial,sans-serif" font-weight="normal" text-anchor="end">SYSTEMS · DELIVERY · VALUE</text>
