<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">From release to realised value</title><desc id="desc">Three questions to consider after a technology change: was it released safely, are people using it, and did it improve the result that matters?</desc><rect x="0" y="0" width="1200" height="1200" rx="0" fill="#102942" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1200" height="13" rx="0" fill="#007f83" stroke="none" stroke-width="1"/><text x="75" y="93" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#8dd9d3" letter-spacing="2">A SERVICE MINDSET</text><text x="75" y="181" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" text-anchor="start" fill="white">From release</text><text x="75" y="257" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" text-anchor="start" fill="white">to realised value</text><text x="75" y="322" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#d8e6ef">Three questions to keep the outcome in view.</text><rect x="75" y="385" width="1050" height="153" rx="20" fill="white" stroke="none" stroke-width="1"/><rect x="104" y="419" width="74" height="74" rx="16" fill="#e5f3f2" stroke="none" stroke-width="1"/><text x="141" y="466" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#007f83">01</text><text x="215" y="450" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#10243d">Release</text><text x="215" y="494" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#52657b">Was the change made available safely?</text><rect x="75" y="575" width="1050" height="153" rx="20" fill="white" stroke="none" stroke-width="1"/><rect x="104" y="609" width="74" height="74" rx="16" fill="#e5f3f2" stroke="none" stroke-width="1"/><text x="141" y="656" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#007f83">02</text><text x="215" y="640" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#10243d">Adoption</text><text x="215" y="684" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#52657b">Are people using it as intended?</text><rect x="75" y="765" width="1050" height="153" rx="20" fill="white" stroke="none" stroke-width="1"/><rect x="104" y="799" width="74" height="74" rx="16" fill="#e5f3f2" stroke="none" stroke-width="1"/><text x="141" y="846" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#007f83">03</text><text x="215" y="830" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#10243d">Outcome</text><text x="215" y="874" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#52657b">Did it improve the result that matters?</text><text x="75" y="1075" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="white">Release is a milestone. Value should be checked in use.</text><text x="75" y="1140" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#adc5d3">An independent learning visual</text></svg>