<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-label="Remote Debugging: Host and MIPS Target"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1477bf"/></marker><marker id="arrowteal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007f88"/></marker></defs><style><![CDATA[
  .bg{fill:#f7fbff}.panel{fill:#fff;stroke:#c6d7e6;stroke-width:2}.deep{fill:#0f2946}.blue{fill:#1477bf}.teal{fill:#007f88}.orange{fill:#d77b24}.title{font:700 31px Arial,sans-serif;fill:#112c49}.subtitle{font:400 16px Arial,sans-serif;fill:#45627d}.heading{font:700 22px Arial,sans-serif;fill:#153957}.body{font:400 17px Arial,sans-serif;fill:#183652}.small{font:400 14px Arial,sans-serif;fill:#45627d}.micro{font:600 13px Arial,sans-serif;fill:#55738e}.light{fill:#eff8fd}.mint{fill:#eaf8f4}.peach{fill:#fff4e6}.pill{fill:#0d5189}.white{font:700 18px Arial,sans-serif;fill:white}.arrow{stroke:#1477bf;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrow-teal{stroke:#007f88;stroke-width:4;fill:none;marker-end:url(#arrowteal)}.dashed{stroke:#3c91b2;stroke-width:3;fill:none;stroke-dasharray:10 9;animation:move 2.4s linear infinite}.outline{stroke:#d6e2ed;stroke-width:2}.tag{font:700 14px Arial,sans-serif;fill:#0d5189}@keyframes move{to{stroke-dashoffset:-38}}@media (prefers-reduced-motion:reduce){.dashed{animation:none}}
]]></style><rect width="1160" height="520" rx="20" class="bg"/><text x="45" y="56" class="title">Remote Debugging: Host and MIPS Target</text><text x="45" y="86" class="subtitle">Cross-compile on the host; execute on the target; inspect symbols through GDB.</text><rect x="42" y="120" width="425" height="294" rx="18" class="panel"/><rect x="691" y="120" width="425" height="294" rx="18" class="panel"/><rect x="42" y="120" width="425" height="64" rx="18" fill="#e3f1fb"/><rect x="691" y="120" width="425" height="64" rx="18" fill="#e3f6f2"/><text x="65" y="161" class="heading">DEVELOPMENT HOST (x86)</text><text x="715" y="161" class="heading">EMBEDDED TARGET (MIPS)</text><text x="65" y="218" class="body">1. Edit C / C++ source</text><text x="65" y="256" class="body">2. Cross-compile main.out</text><text x="65" y="294" class="body">3. Build libhello.so (-g)</text><text x="65" y="332" class="body">4. Run MIPS-compatible GDB</text><text x="715" y="218" class="body">1. Copy executable and .so</text><text x="715" y="256" class="body">2. Run the actual program</text><text x="715" y="294" class="body">3. Start gdbserver :2013</text><text x="715" y="332" class="body">4. Stop at breakpoint in hello.c</text><path d="M468 248 H689" class="arrow"/><text x="512" y="232" class="tag">DEPLOY</text><path d="M690 355 H469" class="arrow-teal"/><text x="505" y="388" class="tag">DEBUG SESSION</text><path d="M480 370 H677" class="dashed"/><rect x="350" y="438" width="460" height="52" rx="18" class="mint"/><text x="365" y="469" class="body">Symbols on host must match target binaries.</text></svg>