<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">From capability to experience</title><desc id="desc">A product offers value through configured resources and a service helps consumers achieve outcomes. Consider utility, warranty, user experience and sustainability together.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f7fafc" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#007f83" stroke="none" stroke-width="1"/><text x="72" y="67" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="2">03 / PRODUCT AND SERVICE</text><text x="72" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#102942">From capability to experience</text><text x="72" y="168" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#52657b">A product enables a service; value depends on outcomes and how the service is experienced.</text><rect x="72" y="220" width="714" height="195" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="97" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Product</text><text x="97" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Resources configured to offer value.</text><text x="97" y="319" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Example: a claims application and its supporting components.</text><rect x="814" y="220" width="714" height="195" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="839" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#10243d">Service</text><text x="839" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Helps consumers achieve outcomes without managing</text><text x="839" y="319" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">certain costs and risks themselves.</text><text x="72" y="474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">FOUR USEFUL QUESTIONS</text><rect x="72" y="500" width="337" height="218" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="94" y="540" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="0.5">UTILITY</text><text x="94" y="588" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Does it do what we need?</text><text x="94" y="673" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Fit for purpose</text><rect x="445" y="500" width="337" height="218" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="467" y="540" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="0.5">WARRANTY</text><text x="467" y="588" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#10243d">Does it meet agreed</text><text x="467" y="618" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#10243d">conditions?</text><text x="467" y="673" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Fit for use</text><rect x="818" y="500" width="337" height="218" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="840" y="540" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="0.5">USER EXPERIENCE</text><text x="840" y="588" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">How does it feel to use?</text><text x="840" y="673" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Perceptions and ease</text><rect x="1191" y="500" width="337" height="218" rx="18" fill="white" stroke="#d9e4ea" stroke-width="1"/><text x="1213" y="540" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="0.5">SUSTAINABILITY</text><text x="1213" y="588" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#10243d">Can it endure responsibly?</text><text x="1213" y="673" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657b">Long-term impact</text><rect x="72" y="765" width="1456" height="130" rx="18" fill="#e5f3f2" stroke="none" stroke-width="1"/><text x="104" y="811" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#007f83" letter-spacing="1">EXAMPLE</text><text x="104" y="847" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#10243d">A workflow may be available and still be confusing, unused or ineffective.</text><text x="104" y="878" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#10243d">Check service performance, adoption and the intended outcome together.</text><line x1="72" y1="937" x2="1528" y2="937" stroke="#d9e4ea" stroke-width="2"/><text x="72" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52657b">Independent learning visual • Inspired by ITIL® (Version 5) • Not an official diagram</text><text x="1528" y="968" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#52657b">ITIL® is a registered trademark of the PeopleCert group.</text></svg>