<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="655" version="1.1" viewBox="0 0 1200 655" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0B1426" height="655" rx="24" width="1200" x="0" y="0" /><rect fill="#63D9CF" height="8" width="1200" x="0" y="0" /><text fill="#F5F8FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" x="54" y="63">Governance is a feedback loop</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="54" y="99">Four activities in the study notes — connected through accountable decisions</text><line stroke="#34465F" stroke-width="2" x1="54" x2="1146" y1="120" y2="120" /><rect fill="#13223A" height="153" rx="18" stroke="#34465F" stroke-width="1.4" width="476" x="74" y="172" /><rect fill="#BAA0FF" height="153" rx="4" width="8" x="74" y="172" /><text fill="#BAA0FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="101" y="212">1  ENGAGE</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="101" y="248">Understand stakeholders, needs,</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="101" y="274">commitments and accountability</text><rect fill="#13223A" height="153" rx="18" stroke="#34465F" stroke-width="1.4" width="476" x="649" y="172" /><rect fill="#78BFFF" height="153" rx="4" width="8" x="649" y="172" /><text fill="#78BFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="676" y="212">2  EVALUATE</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="676" y="248">Assess strategy, risks, options</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="676" y="274">and the current evidence</text><rect fill="#13223A" height="153" rx="18" stroke="#34465F" stroke-width="1.4" width="476" x="649" y="374" /><rect fill="#F6BD78" height="153" rx="4" width="8" x="649" y="374" /><text fill="#F6BD78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="676" y="414">3  DIRECT</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="676" y="450">Set direction, policies, owners</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="676" y="476">and authorised decisions</text><rect fill="#13223A" height="153" rx="18" stroke="#34465F" stroke-width="1.4" width="476" x="74" y="374" /><rect fill="#63D9CF" height="153" rx="4" width="8" x="74" y="374" /><text fill="#63D9CF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="101" y="414">4  MONITOR</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="101" y="450">Review outcomes, compliance,</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="101" y="476">performance and emerging risks</text><line stroke="#BAA0FF" stroke-linecap="round" stroke-width="3" x1="559" x2="637" y1="245" y2="245" /><polygon fill="#BAA0FF" points="637,245 624.58207108109,251.46490845758075 624.58207108109,238.53509154241925" /><line stroke="#78BFFF" stroke-linecap="round" stroke-width="3" x1="885" x2="885" y1="334" y2="362" /><polygon fill="#78BFFF" points="885,362 878.5350915424192,349.58207108109 891.4649084575808,349.58207108109" /><line stroke="#F6BD78" stroke-linecap="round" stroke-width="3" x1="640" x2="560" y1="400" y2="400" /><polygon fill="#F6BD78" points="560,400 572.41792891891,393.53509154241925 572.41792891891,406.46490845758075" /><line stroke="#63D9CF" stroke-linecap="round" stroke-width="3" x1="308" x2="308" y1="366" y2="338" /><polygon fill="#63D9CF" points="308,338 314.46490845758075,350.41792891891 301.53509154241925,350.41792891891" /><rect fill="#192B46" height="33" rx="16" stroke="#63D9CF" stroke-opacity="0.45" width="330" x="438" y="563" /><text fill="#63D9CF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="603.0" y="586">Evidence informs the next decision</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="54" y="624">Governance creates clarity about who may decide, who is accountable and what must be monitored.</text></svg>