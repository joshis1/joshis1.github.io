,348.41792891891" /><text fill="#F5F8FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" x="600" y="595">Review  •  Learn  •  Adapt  •  Sustain</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="54" y="639">A completed task is an output. The improvement claim needs evidence of a better result.</text></svg>