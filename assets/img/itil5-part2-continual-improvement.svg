<svg baseProfile="full" height="670" version="1.1" viewBox="0 0 1200 670" width="1200" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0B1426" height="670" rx="24" width="1200" x="0" y="0" /><rect fill="#63D9CF" height="8" width="1200" x="0" y="0" /><text fill="#F5F8FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" x="54" y="63">Continual improvement: six questions</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="54" y="99">Start with outcomes, establish the baseline, experiment and check actual progress</text><line stroke="#34465F" stroke-width="2" x1="54" x2="1146" y1="120" y2="120" /><rect fill="#13223A" height="152" rx="18" stroke="#34465F" stroke-width="1.4" width="310" x="55" y="171" /><rect fill="#BAA0FF" height="152" rx="4" width="8" x="55" y="171" /><text fill="#BAA0FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="82" y="211">01  VISION</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="82" y="247">What are we trying</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="82" y="273">to achieve?</text><rect fill="#13223A" height="152" rx="18" stroke="#34465F" stroke-width="1.4" width="310" x="445" y="171" /><rect fill="#78BFFF" height="152" rx="4" width="8" x="445" y="171" /><text fill="#78BFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="472" y="211">02  NOW</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="472" y="247">What is the</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="472" y="273">current baseline?</text><rect fill="#13223A" height="152" rx="18" stroke="#34465F" stroke-width="1.4" width="310" x="835" y="171" /><rect fill="#63D9CF" height="152" rx="4" width="8" x="835" y="171" /><text fill="#63D9CF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="862" y="211">03  TARGET</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="862" y="247">What would better</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="862" y="273">look like?</text><rect fill="#13223A" height="152" rx="18" stroke="#34465F" stroke-width="1.4" width="310" x="835" y="387" /><rect fill="#F6BD78" height="152" rx="4" width="8" x="835" y="387" /><text fill="#F6BD78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="862" y="427">04  PLAN</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="862" y="463">How will we</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="862" y="489">get there?</text><rect fill="#13223A" height="152" rx="18" stroke="#34465F" stroke-width="1.4" width="310" x="445" y="387" /><rect fill="#8EE6AE" height="152" rx="4" width="8" x="445" y="387" /><text fill="#8EE6AE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="472" y="427">05  ACT</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="472" y="463">Try improvements</text><text fill="#ADBDD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19"